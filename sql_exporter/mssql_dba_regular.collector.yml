# A collector defining standard metrics for Microsoft SQL Server.
#
# It is required that the SQL Server user has the following permissions:
#
#   GRANT VIEW ANY DEFINITION TO
#   GRANT VIEW SERVER STATE TO
#
collector_name: mssql_dba_regular

# Similar to global.min_interval, but applies to the queries defined by this collector only.
#min_interval: 0s

metrics:
  - metric_name: mssql_service_info
    type: gauge
    help: 'SQL Server instance/service availability and metadata.'
    static_labels:
      env: prod
      infra_type: on-prem
      owner: dba_team
      app: sqlmonitor
    key_labels:
      - domain
      - ip
      - at_server_name
      - machine_name
      - server_name
      - host_name
      - sql_version
      - service_name_str
      - service_name
      - instance_name
      - service_account
      - ports
      - edition
      - product_version
      - product_level
    values: [up]
    query: |
      ;WITH cte_ports as (
          SELECT [ports] =
                    STUFF((
                        SELECT ', ' + CONVERT(varchar(20), p.local_tcp_port)
                        FROM (
                        SELECT DISTINCT local_net_address, local_tcp_port
                        FROM sys.dm_exec_connections
                        WHERE local_net_address IS NOT NULL
                ) p
          FOR XML PATH(''), TYPE).value('.', 'varchar(2000)'), 1, 2, '')
      )
      ,server_services AS (
        SELECT *
        FROM sys.dm_server_services
        WHERE servicename LIKE 'SQL Server (%)'
          OR servicename LIKE 'SQL Server Agent (%)'
      )
      SELECT
        [domain] = DEFAULT_DOMAIN(),
        [ip] = CONNECTIONPROPERTY('local_net_address'),
        [at_server_name] = @@SERVERNAME,
        [machine_name] = SERVERPROPERTY('MachineName'),
        [server_name] = SERVERPROPERTY('ServerName'),
        [host_name] = COALESCE(SERVERPROPERTY('ComputerNamePhysicalNetBIOS'), SERVERPROPERTY('ServerName')),
        [sql_version] = @@VERSION,
        [service_name_str] = servicename,
        [service_name] = CASE
          WHEN @@SERVICENAME IS NULL THEN 'MSSQLSERVER'
          WHEN @@SERVICENAME = 'MSSQLSERVER' AND servicename LIKE 'SQL Server (%)' THEN 'MSSQLSERVER'
          WHEN @@SERVICENAME = 'MSSQLSERVER' AND servicename LIKE 'SQL Server Agent (%)' THEN 'SQLSERVERAGENT'
          WHEN @@SERVICENAME <> 'MSSQLSERVER' AND servicename LIKE 'SQL Server (%)' THEN 'MSSQL$' + @@SERVICENAME
          WHEN @@SERVICENAME <> 'MSSQLSERVER' AND servicename LIKE 'SQL Server Agent (%)' THEN 'SQLAgent' + @@SERVICENAME
          ELSE 'MSSQL$' + @@SERVICENAME
        END,
        [instance_name] = COALESCE(@@SERVICENAME, 'MSSQLSERVER'),
        [service_account] = service_account,
        [ports],
        [edition] = SERVERPROPERTY('Edition'),
        [product_version] = SERVERPROPERTY('ProductVersion'),
        [product_level] = SERVERPROPERTY('ProductLevel'),
        [up] = CAST(1 AS bigint)
      FROM (VALUES ('Basic-Details')) d (RunningQuery)
      FULL OUTER JOIN server_services ss ON 1 = 1
      FULL OUTER JOIN cte_ports p ON 1=1;

  - metric_name: mssql_host_physical_memory_bytes
    type: gauge
    help: 'Host physical memory in bytes.'
    value_label: state
    values: [total, available]
    query_ref: mssql_sys_memory

  - metric_name: mssql_sql_process_memory_bytes
    type: gauge
    help: 'SQL Server process memory allocations in bytes.'
    value_label: state
    values: [in_use, locked_pages, large_pages]
    query_ref: mssql_process_memory

  - metric_name: mssql_cpu_utilization_percentage
    type: gauge
    help: 'CPU utilization percentages from the SQL Server scheduler monitor ring buffer.'
    value_label: scope
    values: [system, sqlserver]
    query_ref: mssql_cpu_utilization

  - metric_name: mssql_memory_manager_bytes
    type: gauge
    help: 'SQL Server memory manager allocations in bytes.'
    value_label: state
    values: [granted_workspace, maximum_workspace, stolen_server, total_server, target_server, sql_cache, free]
    query_ref: mssql_memory_manager

  - metric_name: mssql_memory_grants_outstanding
    type: gauge
    help: 'Outstanding workspace memory grants.'
    values: [memory_grants_outstanding]
    query_ref: mssql_memory_manager

  - metric_name: mssql_database_file_size_bytes
    type: gauge
    help: 'Database file sizes in bytes.'
    key_labels:
      - db
    value_label: state
    values: [data, log, log_used]
    query_ref: mssql_database_space

  - metric_name: mssql_database_percent_log_used
    type: gauge
    help: 'Transaction log space used as a percentage per database.'
    key_labels:
      - db
    values: [percent_log_used]
    query_ref: mssql_database_space

  - metric_name: mssql_database_active_transactions
    type: gauge
    help: 'Current active transactions per database.'
    key_labels:
      - db
    values: [active_transactions]
    query_ref: mssql_database_space

  - metric_name: mssql_database_xtp_memory_used_bytes
    type: gauge
    help: 'XTP memory usage in bytes per database.'
    key_labels:
      - db
    values: [xtp_memory_used]
    query_ref: mssql_database_space

  - metric_name: mssql_database_log_events_total
    type: counter
    help: 'Database log event counts since SQL Server startup.'
    key_labels:
      - db
    value_label: event
    values: [growths, shrinks, truncations]
    query_ref: mssql_database_space

  - metric_name: mssql_active_cursors
    type: gauge
    help: 'Current active cursors by cursor type.'
    key_labels:
      - cursor_type
    values: [active_cursors]
    query_ref: mssql_active_cursors

  - metric_name: mssql_user_connections
    type: gauge
    help: 'Current user connections from SQL Server general statistics.'
    values: [user_connections]
    query_ref: mssql_general_statistics_snapshot

  - metric_name: mssql_temp_tables_for_destruction
    type: gauge
    help: 'Temp tables waiting to be destroyed.'
    values: [temp_tables_for_destruction]
    query_ref: mssql_general_statistics_snapshot

  - metric_name: mssql_waits_in_progress
    type: gauge
    help: 'Current waits in progress by wait category.'
    key_labels:
      - wait_type
    values: [waits_in_progress]
    query_ref: mssql_wait_stats

  - metric_name: mssql_transactions
    type: gauge
    help: 'Current transaction count per database from the Transactions object.'
    key_labels:
      - db
    values: [transactions]
    query_ref: mssql_transactions

  - metric_name: mssql_tempdb_space_bytes
    type: gauge
    help: 'tempdb free space and version store size in bytes.'
    value_label: state
    values: [free_space, version_store]
    query_ref: mssql_tempdb_transactions

  - metric_name: mssql_longest_transaction_running_time_seconds
    type: gauge
    help: 'Longest transaction running time in seconds.'
    values: [longest_transaction_running_time]
    query_ref: mssql_tempdb_transactions

  - metric_name: mssql_worktables_from_cache_ratio
    type: gauge
    help: 'Worktables-from-cache ratio as a percentage.'
    values: [worktables_from_cache_ratio]
    query_ref: mssql_access_methods_ratio

  - metric_name: mssql_resource_pool_cpu_usage_percentage
    type: gauge
    help: 'CPU usage percentage by resource pool.'
    key_labels:
      - resource_pool
    values: [cpu_usage_percentage]
    query_ref: mssql_resource_pool_cpu

  - metric_name: mssql_workload_group_cpu_usage_percentage
    type: gauge
    help: 'CPU usage percentage by workload group.'
    key_labels:
      - workload_group
    values: [cpu_usage_percentage]
    query_ref: mssql_workload_group_cpu

  - metric_name: mssql_sql_auto_params_total
    type: counter
    help: 'Automatic parameterization activity counters since SQL Server startup.'
    value_label: mode
    values: [attempts, failed, safe, unsafe]
    query_ref: mssql_sql_statistics

  - metric_name: mssql_sql_attentions_total
    type: counter
    help: 'SQL attentions since SQL Server startup.'
    values: [sql_attentions]
    query_ref: mssql_sql_statistics

  - metric_name: mssql_buffer_manager_operations_total
    type: counter
    help: 'Buffer manager operation counters since SQL Server startup.'
    value_label: operation
    values: [lazy_writes, free_list_stalls, readahead_pages]
    query_ref: mssql_buffer_manager_counters

  - metric_name: mssql_lock_waits_total
    type: counter
    help: 'Lock waits since SQL Server startup.'
    values: [lock_waits]
    query_ref: mssql_lock_counters

  - metric_name: mssql_lock_wait_time_ms_total
    type: counter
    help: 'Accumulated lock wait time in milliseconds since SQL Server startup.'
    values: [lock_wait_time_ms]
    query_ref: mssql_lock_counters

  - metric_name: mssql_access_methods_total
    type: counter
    help: 'Access methods counters since SQL Server startup.'
    value_label: operation
    values: [full_scans, forwarded_records, index_searches, page_splits, workfiles_created, worktables_created, table_lock_escalations]
    query_ref: mssql_access_methods_counters

  - metric_name: mssql_database_log_bytes_flushed_total
    type: counter
    help: 'Database log bytes flushed since SQL Server startup.'
    key_labels:
      - db
    values: [log_bytes_flushed]
    query_ref: mssql_database_log_counters

  - metric_name: mssql_database_log_flush_wait_time_ms_total
    type: counter
    help: 'Accumulated database log flush wait time in milliseconds since SQL Server startup.'
    key_labels:
      - db
    values: [log_flush_wait_time_ms]
    query_ref: mssql_database_log_counters

  - metric_name: mssql_database_log_waits_total
    type: counter
    help: 'Database log flush waits since SQL Server startup.'
    key_labels:
      - db
    values: [log_flush_waits]
    query_ref: mssql_database_log_counters

  - metric_name: mssql_database_log_flushes_total
    type: counter
    help: 'Database log flushes since SQL Server startup.'
    key_labels:
      - db
    values: [log_flushes]
    query_ref: mssql_database_log_counters

  - metric_name: mssql_sql_errors_total
    type: counter
    help: 'SQL error counters since SQL Server startup.'
    key_labels:
      - error_type
    values: [errors]
    query_ref: mssql_sql_errors

  - metric_name: mssqlbuffer_pool_committed
    type: gauge
    help: 'SQL Server buffer pool committed bytes.'
    values: [buffer_pool_committed]
    query_ref: mssql_sys_info_memory

  - metric_name: mssqlbuffer_pool_committed_target
    type: gauge
    help: 'SQL Server buffer pool committed target bytes.'
    values: [buffer_pool_committed_target]
    query_ref: mssql_sys_info_memory

  - metric_name: mssql_active_transactions_count
    type: gauge
    help: 'Count of active transactions from sys.dm_tran_active_transactions.'
    values: [active_transactions_count]
    query_ref: mssql_active_transactions_count

  - metric_name: mssql_write_transactions
    type: counter
    help: 'Write transactions since SQL Server startup.'
    values: [write_transactions]
    query_ref: mssql_replica_counters

  - metric_name: mssql_processes_blocked
    type: gauge
    help: 'Currently blocked processes.'
    values: [processes_blocked]
    query_ref: mssql_general_statistics_snapshot

  - metric_name: mssql_average_latch_wait_time_ms
    type: gauge
    help: 'Average latch wait time metric from SQL Server performance counters.'
    values: [average_latch_wait_time_ms]
