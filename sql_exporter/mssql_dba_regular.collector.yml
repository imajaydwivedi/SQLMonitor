  - metric_name: mssql_memory_grants_pending
    type: gauge
    help: 'Pending workspace memory grants.'
    values: [memory_grants_pending]
    query_ref: mssql_memory_manager

  - metric_name: mssql_sql_compilations
    type: counter
    help: 'SQL compilations since SQL Server startup.'
    values: [sql_compilations]
    query_ref: mssql_sql_statistics

  - metric_name: mssql_sql_recompilations
    type: counter
    help: 'SQL recompilations since SQL Server startup.'
    values: [sql_recompilations]
    query_ref: mssql_sql_statistics

  - metric_name: mssql_page_reads
    type: counter
    help: 'Buffer manager page reads since SQL Server startup.'
    values: [page_reads]
    query_ref: mssql_buffer_manager_counters

  - metric_name: mssql_page_lookups
    type: counter
    help: 'Buffer manager page lookups since SQL Server startup.'
    values: [page_lookups]
    query_ref: mssql_buffer_manager_counters

  - metric_name: mssql_page_writes
    type: counter
    help: 'Buffer manager page writes since SQL Server startup.'
    values: [page_writes]
    query_ref: mssql_buffer_manager_counters

  - metric_name: mssql_connection_reset
    type: counter
    help: 'Connection resets since SQL Server startup.'
    values: [connection_reset]
    query_ref: mssql_general_statistics_counters

  - metric_name: mssql_logins
    type: counter
    help: 'Logins since SQL Server startup.'
    values: [logins]
    query_ref: mssql_general_statistics_counters

  - metric_name: mssql_logouts
    type: counter
    help: 'Logouts since SQL Server startup.'
    values: [logouts]
    query_ref: mssql_general_statistics_counters

  - metric_name: mssql_buffer_database_pages
    type: gauge
    help: 'Database pages in the SQL Server buffer pool.'
    values: [buffer_database_pages]
    query_ref: mssql_buffer_manager_counters

  - metric_name: mssql_buffer_target_pages
    type: gauge
    help: 'Target pages in the SQL Server buffer pool.'
    values: [buffer_target_pages]
    query_ref: mssql_buffer_manager_counters

  - metric_name: mssql_tempdb_active_temp_tables
    type: gauge
    help: 'Active temp tables from SQL Server general statistics.'
    values: [tempdb_active_temp_tables]
    query_ref: mssql_general_statistics_snapshot

  - metric_name: mssql_log_apply_pending_queue
    type: gauge
    help: 'Log apply pending queue.'
    values: [log_apply_pending_queue]
    query_ref: mssql_replica_counters

  - metric_name: mssql_log_remaining_for_undo
    type: gauge
    help: 'Log remaining for undo.'
    values: [log_remaining_for_undo]
    query_ref: mssql_replica_counters

  - metric_name: mssql_log_send_queue
    type: gauge
    help: 'Log send queue.'
    values: [log_send_queue]
    query_ref: mssql_replica_counters

  - metric_name: mssql_redo_blocked
    type: counter
    help: 'Redo blocked events since SQL Server startup.'
    values: [redo_blocked]
    query_ref: mssql_replica_counters

  - metric_name: mssql_transaction_delay
    type: gauge
    help: 'Transaction delay for database replicas.'
    values: [transaction_delay]
    query_ref: mssql_replica_counters

  - metric_name: mssql_page_io_latch_waits_ms
    type: gauge
    help: 'Page IO latch wait time metric from SQL Server wait statistics.'
    values: [page_io_latch_waits_ms]
    query_ref: mssql_wait_stats_averages

  - metric_name: mssql_network_io_waits_ms
    type: gauge
    help: 'Network IO wait time metric from SQL Server wait statistics.'
    values: [network_io_waits_ms]
    query_ref: mssql_wait_stats_averages

  - metric_name: mssql_mirrored_write_transactions
    type: counter
    help: 'Mirrored write transactions since SQL Server startup.'
    values: [mirrored_write_transactions]
    query_ref: mssql_replica_counters

  - metric_name: mssql_bytes_sent_to_replica
    type: counter
    help: 'Bytes sent to replica since SQL Server startup.'
    values: [bytes_sent_to_replica]
    query_ref: mssql_replica_counters

  - metric_name: mssql_database_info
    type: gauge
    help: 'Info metric with database state and AG status. Value is always 1.'
    key_labels:
      - database_name
      - state
      - state_desc
      - is_ha_instance
      - is_in_ag
    values: [value]
    query_ref: mssql_database_info_query

  - metric_name: mssql_ag_database_out_of_sync
    type: gauge
    help: 'Indicates if an AG database is out of sync. Metric only appears if a problem exists.'
    values: [value]
    key_labels:
      - AR_REPLICA_SERVER_NAME
      - DATABASE_NAME
      - SYNC_STATE_DESC
      - DB_STATE_DESC
    query_ref: mssql_ag_database_out_of_sync_query

  - metric_name: mssql_last_logsweep
    type: gauge
    help: 'Shows databases with log backup overdue by more than 4 hours.'
    key_labels:
      - OVERDUE_DATABASES
      - LAST_LOGSWEEP_DATES
    values: [max_minutes_overdue]
    query_ref: mssql_last_logsweep_query

  - metric_name: mssql_max_server_memory_mb
    type: gauge
    help: 'Configured max server memory in MB.'
    values: [max_server_memory_mb]
    query: |
      SELECT CAST(value_in_use AS bigint) AS max_server_memory_mb
      FROM sys.configurations
      WHERE name = 'max server memory (MB)'

  - metric_name: mssql_memory_consumers
    type: gauge
    help: 'Requests currently consuming more than 500 MB of granted query memory.'
    values: [memory_consumers]
    query: |
      SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;
      DECLARE @granted_memory_threshold_mb int = 500;
      SELECT COUNT(*) AS memory_consumers
      FROM sys.dm_exec_requests
      WHERE (granted_query_memory * 8) > (@granted_memory_threshold_mb * 1024);

  - metric_name: mssql_active_requests_count
    type: gauge
    help: 'Count of active, blocking, or open-transaction sessions based on DBA usp_active_requests_count logic.'
    values: [active_requests_count]
    query_ref: mssql_active_requests_count

  - metric_name: mssql_db__log_reuse_wait
    type: gauge
    help: 'sys.databases.log_reuse_wait value.'
    key_labels:
      - db_name
      - log_reuse_wait_desc
    values: [log_reuse_wait]
    query:
      SELECT name AS db_name, log_reuse_wait, log_reuse_wait_desc from sys.databases

  - metric_name: mssql_memory_clerks__size_mb
    type: gauge
    help: 'Memory clerk size in MB information.'
    key_labels:
      - memory_clerk_type
      - memory_clerk_name
    values: [size_mb]
    query: |
      SELECT	[memory_clerk_type] = [type],
              [memory_clerk_name] = MAX(name),
              [size_mb] = SUM(pages_kb) / 1024
      FROM sys.dm_os_memory_clerks WITH (NOLOCK)
      GROUP BY [type]
      HAVING (SUM(pages_kb) / 1024) > 0
      ORDER BY SUM(pages_kb) DESC;

  - metric_name: mssql_logsaver__collection_time
    type: gauge
    help: 'Log saver collection time as Unix epoch seconds per database.'
    key_labels:
      - database_name
    values: [collection_time]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__thresholds_violated
    type: gauge
    help: 'Whether configured log saver thresholds are violated for the database.'
    key_labels:
      - database_name
      - recovery_model
      - log_reuse_wait_desc
      - threshold_condition
    values: [thresholds_violated]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__transaction_start_time
    type: gauge
    help: 'Oldest open transaction start time as Unix epoch seconds per database.'
    key_labels:
      - database_name
      - spid
      - login_name
      - program_name
      - host_name
      - host_process_id
      - command
      - sql_text
    values: [transaction_start_time]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__log_size_mb
    type: gauge
    help: 'Transaction log size in MB per database.'
    key_labels:
      - database_name
    values: [log_size_mb]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__log_used_mb
    type: gauge
    help: 'Transaction log used space in MB per database.'
    key_labels:
      - database_name
    values: [log_used_mb]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__exists_valid_autogrowing_file
    type: gauge
    help: 'Whether a valid auto-growing log file exists for the database.'
    key_labels:
      - database_name
    values: [exists_valid_autogrowing_file]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__log_used_pct
    type: gauge
    help: 'Transaction log used percentage per database.'
    key_labels:
      - database_name
    values: [log_used_pct]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__log_used_pct_threshold
    type: gauge
    help: 'Configured transaction log used percentage threshold per database.'
    key_labels:
      - database_name
    values: [log_used_pct_threshold]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__log_used_gb_threshold
    type: gauge
    help: 'Configured transaction log used GB threshold per database.'
    key_labels:
      - database_name
    values: [log_used_gb_threshold]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__is_pct_threshold_valid
    type: gauge
    help: 'Whether the log used percentage threshold is valid for alerting.'
    key_labels:
      - database_name
    values: [is_pct_threshold_valid]
    query_ref: mssql_logsaver

  - metric_name: mssql_logsaver__is_gb_threshold_valid
    type: gauge
    help: 'Whether the log used GB threshold is valid for alerting.'
    key_labels:
      - database_name
    values: [is_gb_threshold_valid]
    query_ref: mssql_logsaver

queries:
  - query_name: mssql_sys_memory
    query: |
      SELECT
        total_physical_memory_kb * 1024 AS total,
        available_physical_memory_kb * 1024 AS available
      FROM sys.dm_os_sys_memory

  - query_name: mssql_process_memory
    query: |
      SELECT
        physical_memory_in_use_kb * 1024 AS in_use,
        locked_page_allocations_kb * 1024 AS locked_pages,
        large_page_allocations_kb * 1024 AS large_pages
      FROM sys.dm_os_process_memory

  - query_name: mssql_cpu_utilization
    query: |
      WITH rb AS (
        SELECT TOP (1)
          100 - record.value('(Record/SchedulerMonitorEvent/SystemHealth/SystemIdle)[1]', 'int') AS system,
          record.value('(Record/SchedulerMonitorEvent/SystemHealth/ProcessUtilization)[1]', 'int') AS sqlserver,
          DATEADD(ms, -1 * (ts_now - [timestamp]), SYSDATETIME()) AS sample_time
        FROM (
          SELECT
            CAST(record AS xml) AS record,
            [timestamp],
            cpu_ticks / (cpu_ticks / ms_ticks) AS ts_now
          FROM sys.dm_os_ring_buffers
          CROSS APPLY sys.dm_os_sys_info
          WHERE ring_buffer_type = 'RING_BUFFER_SCHEDULER_MONITOR'
            AND record LIKE '%<SystemHealth>%'
        ) s
        ORDER BY sample_time DESC
      )
      SELECT system, sqlserver
      FROM rb

  - query_name: mssql_memory_manager
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'Granted Workspace Memory (KB)' THEN cntr_value * 1024 END) AS granted_workspace,
        MAX(CASE WHEN counter_name = 'Maximum Workspace Memory (KB)' THEN cntr_value * 1024 END) AS maximum_workspace,
        MAX(CASE WHEN counter_name = 'Memory Grants Pending' THEN cntr_value END) AS memory_grants_pending,
        MAX(CASE WHEN counter_name = 'Memory Grants Outstanding' THEN cntr_value END) AS memory_grants_outstanding,
        MAX(CASE WHEN counter_name = 'Stolen Server Memory (KB)' THEN cntr_value * 1024 END) AS stolen_server,
        MAX(CASE WHEN counter_name = 'Total Server Memory (KB)' THEN cntr_value * 1024 END) AS total_server,
        MAX(CASE WHEN counter_name = 'Target Server Memory (KB)' THEN cntr_value * 1024 END) AS target_server,
        MAX(CASE WHEN counter_name = 'SQL Cache Memory (KB)' THEN cntr_value * 1024 END) AS sql_cache,
        MAX(CASE WHEN counter_name = 'Free Memory (KB)' THEN cntr_value * 1024 END) AS free
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Memory Manager%'
        AND counter_name IN (
          'Granted Workspace Memory (KB)',
          'Maximum Workspace Memory (KB)',
          'Memory Grants Pending',
          'Memory Grants Outstanding',
          'Stolen Server Memory (KB)',
          'Total Server Memory (KB)',
          'Target Server Memory (KB)',
          'SQL Cache Memory (KB)',
          'Free Memory (KB)'
        )

  - query_name: mssql_database_space
    query: |
      SELECT
        RTRIM(instance_name) AS db,
        MAX(CASE WHEN counter_name = 'Data File(s) Size (KB)' THEN cntr_value * 1024 END) AS data,
        MAX(CASE WHEN counter_name = 'Log File(s) Size (KB)' THEN cntr_value * 1024 END) AS log,
        MAX(CASE WHEN counter_name = 'Log File(s) Used Size (KB)' THEN cntr_value * 1024 END) AS log_used,
        MAX(CASE WHEN counter_name = 'Percent Log Used' THEN cntr_value END) AS percent_log_used,
        MAX(CASE WHEN counter_name = 'Active Transactions' THEN cntr_value END) AS active_transactions,
        MAX(CASE WHEN counter_name = 'XTP Memory Used (KB)' THEN cntr_value * 1024 END) AS xtp_memory_used,
        MAX(CASE WHEN counter_name = 'Log Growths' THEN cntr_value END) AS growths,
        MAX(CASE WHEN counter_name = 'Log Shrinks' THEN cntr_value END) AS shrinks,
        MAX(CASE WHEN counter_name = 'Log Truncations' THEN cntr_value END) AS truncations
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Databases%'
        AND instance_name NOT IN ('_Total', 'mssqlsystemresource')
        AND counter_name IN (
          'Data File(s) Size (KB)',
          'Log File(s) Size (KB)',
          'Log File(s) Used Size (KB)',
          'Percent Log Used',
          'Active Transactions',
          'XTP Memory Used (KB)',
          'Log Growths',
          'Log Shrinks',
          'Log Truncations'
        )
      GROUP BY RTRIM(instance_name)

  - query_name: mssql_active_cursors
    query: |
      SELECT
        RTRIM(instance_name) AS cursor_type,
        cntr_value AS active_cursors
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Cursor Manager by Type%'
        AND counter_name = 'Active cursors'
        AND instance_name <> '_Total'

  - query_name: mssql_general_statistics_snapshot
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'User Connections' THEN cntr_value END) AS user_connections,
        MAX(CASE WHEN counter_name = 'Temp Tables For Destruction' THEN cntr_value END) AS temp_tables_for_destruction,
        MAX(CASE WHEN counter_name = 'Processes blocked' THEN cntr_value END) AS processes_blocked,
        MAX(CASE WHEN counter_name = 'Active Temp Tables' THEN cntr_value END) AS tempdb_active_temp_tables
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:General Statistics%'
        AND counter_name IN ('User Connections', 'Temp Tables For Destruction', 'Processes blocked', 'Active Temp Tables')

  - query_name: mssql_wait_stats
    query: |
      SELECT
        RTRIM(counter_name) AS wait_type,
        cntr_value AS waits_in_progress
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Wait Statistics%'
        AND instance_name = 'Waits in progress'

  - query_name: mssql_transactions
    query: |
      SELECT
        RTRIM(instance_name) AS db,
        cntr_value AS transactions
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Transactions%'
        AND counter_name = 'Transactions'
        AND instance_name NOT IN ('', '_Total')

  - query_name: mssql_tempdb_transactions
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'Free Space in tempdb (KB)' THEN cntr_value * 1024 END) AS free_space,
        MAX(CASE WHEN counter_name = 'Version Store Size (KB)' THEN cntr_value * 1024 END) AS version_store,
        MAX(CASE WHEN counter_name = 'Longest Transaction Running Time' THEN cntr_value END) AS longest_transaction_running_time
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Transactions%'
        AND counter_name IN (
          'Free Space in tempdb (KB)',
          'Version Store Size (KB)',
          'Longest Transaction Running Time'
        )

  - query_name: mssql_access_methods_ratio
    query: |
      WITH ratio AS (
        SELECT TOP (1) CAST(cntr_value AS float) AS numerator
        FROM sys.dm_os_performance_counters WITH (NOLOCK)
        WHERE object_name LIKE '%:Access Methods%'
          AND counter_name = 'Worktables From Cache Ratio'
      ),
      base AS (
        SELECT TOP (1) CAST(cntr_value AS float) AS denominator
        FROM sys.dm_os_performance_counters WITH (NOLOCK)
        WHERE object_name LIKE '%:Access Methods%'
          AND counter_name = 'Worktables From Cache Ratio Base'
      )
      SELECT
        CASE WHEN base.denominator = 0 THEN NULL ELSE 100.0 * ratio.numerator / base.denominator END AS worktables_from_cache_ratio
      FROM ratio
      CROSS JOIN base

  - query_name: mssql_resource_pool_cpu
    query: |
      SELECT
        RTRIM(fr.instance_name) AS resource_pool,
        CASE WHEN bs.cntr_value = 0 THEN NULL ELSE 100.0 * fr.cntr_value / bs.cntr_value END AS cpu_usage_percentage
      FROM sys.dm_os_performance_counters fr WITH (NOLOCK)
      JOIN sys.dm_os_performance_counters bs WITH (NOLOCK)
        ON bs.object_name = fr.object_name
       AND ISNULL(bs.instance_name, '') = ISNULL(fr.instance_name, '')
       AND bs.counter_name = 'CPU usage % base'
      WHERE fr.object_name LIKE '%:Resource Pool Stats%'
        AND fr.counter_name = 'CPU usage %'

  - query_name: mssql_workload_group_cpu
    query: |
      SELECT
        RTRIM(fr.instance_name) AS workload_group,
        CASE WHEN bs.cntr_value = 0 THEN NULL ELSE 100.0 * fr.cntr_value / bs.cntr_value END AS cpu_usage_percentage
      FROM sys.dm_os_performance_counters fr WITH (NOLOCK)
      JOIN sys.dm_os_performance_counters bs WITH (NOLOCK)
        ON bs.object_name = fr.object_name
       AND ISNULL(bs.instance_name, '') = ISNULL(fr.instance_name, '')
       AND bs.counter_name = 'CPU usage % base'
      WHERE fr.object_name LIKE '%:Workload Group Stats%'
        AND fr.counter_name = 'CPU usage %'

  - query_name: mssql_sql_statistics
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'SQL Attention rate' THEN cntr_value END) AS sql_attentions,
        MAX(CASE WHEN counter_name = 'Auto-Param Attempts/sec' THEN cntr_value END) AS attempts,
        MAX(CASE WHEN counter_name = 'Failed Auto-Params/sec' THEN cntr_value END) AS failed,
        MAX(CASE WHEN counter_name = 'Safe Auto-Params/sec' THEN cntr_value END) AS safe,
        MAX(CASE WHEN counter_name = 'Unsafe Auto-Params/sec' THEN cntr_value END) AS unsafe,
        MAX(CASE WHEN counter_name = 'SQL Compilations/sec' THEN cntr_value END) AS sql_compilations,
        MAX(CASE WHEN counter_name = 'SQL Re-Compilations/sec' THEN cntr_value END) AS sql_recompilations
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:SQL Statistics%'
        AND counter_name IN (
          'SQL Attention rate',
          'Auto-Param Attempts/sec',
          'Failed Auto-Params/sec',
          'Safe Auto-Params/sec',
          'Unsafe Auto-Params/sec',
          'SQL Compilations/sec',
          'SQL Re-Compilations/sec'
        )

  - query_name: mssql_buffer_manager_counters
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'Lazy writes/sec' THEN cntr_value END) AS lazy_writes,
        MAX(CASE WHEN counter_name = 'Free list stalls/sec' THEN cntr_value END) AS free_list_stalls,
        MAX(CASE WHEN counter_name = 'Readahead pages/sec' THEN cntr_value END) AS readahead_pages,
        MAX(CASE WHEN counter_name = 'Page reads/sec' THEN cntr_value END) AS page_reads,
        MAX(CASE WHEN counter_name = 'Page lookups/sec' THEN cntr_value END) AS page_lookups,
        MAX(CASE WHEN counter_name = 'Page writes/sec' THEN cntr_value END) AS page_writes,
        MAX(CASE WHEN counter_name = 'Database pages' THEN cntr_value END) AS buffer_database_pages,
        MAX(CASE WHEN counter_name = 'Target pages' THEN cntr_value END) AS buffer_target_pages
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Buffer Manager%'
        AND counter_name IN (
          'Lazy writes/sec',
          'Free list stalls/sec',
          'Readahead pages/sec',
          'Page reads/sec',
          'Page lookups/sec',
          'Page writes/sec',
          'Database pages',
          'Target pages'
        )

  - query_name: mssql_sys_info_memory
    query: |
      SELECT
        committed_kb * 1024.0 AS buffer_pool_committed,
        committed_target_kb * 1024.0 AS buffer_pool_committed_target
      FROM sys.dm_os_sys_info

  - query_name: mssql_active_transactions_count
    query: |
      SELECT COUNT(*) AS active_transactions_count
      FROM sys.dm_tran_active_transactions

  - query_name: mssql_latch_wait_stats
    query: |
      SELECT TOP (1)
        cntr_value AS average_latch_wait_time_ms
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Latches%'
        AND counter_name = 'Average Latch Wait Time (ms)'

  - query_name: mssql_general_statistics_counters
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'Connection Reset/sec' THEN cntr_value END) AS connection_reset,
        MAX(CASE WHEN counter_name = 'Logins/sec' THEN cntr_value END) AS logins,
        MAX(CASE WHEN counter_name = 'Logouts/sec' THEN cntr_value END) AS logouts
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:General Statistics%'
        AND counter_name IN ('Connection Reset/sec', 'Logins/sec', 'Logouts/sec')

  - query_name: mssql_replica_counters
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'Write Transactions/sec' THEN cntr_value END) AS write_transactions,
        MAX(CASE WHEN counter_name = 'Log Apply Pending Queue' THEN cntr_value END) AS log_apply_pending_queue,
        MAX(CASE WHEN counter_name = 'Log remaining for undo' THEN cntr_value END) AS log_remaining_for_undo,
        MAX(CASE WHEN counter_name = 'Log Send Queue' THEN cntr_value END) AS log_send_queue,
        MAX(CASE WHEN counter_name = 'Redo blocked/sec' THEN cntr_value END) AS redo_blocked,
        MAX(CASE WHEN counter_name = 'Transaction Delay' THEN cntr_value END) AS transaction_delay,
        MAX(CASE WHEN counter_name = 'Mirrored Write Transactions/sec' THEN cntr_value END) AS mirrored_write_transactions,
        MAX(CASE WHEN counter_name = 'Bytes Sent to Replica/sec' THEN cntr_value END) AS bytes_sent_to_replica
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Database Replica%'
        AND instance_name = '_Total'
        AND counter_name IN (
          'Write Transactions/sec',
          'Log Apply Pending Queue',
          'Log remaining for undo',
          'Log Send Queue',
          'Redo blocked/sec',
          'Transaction Delay',
          'Mirrored Write Transactions/sec',
          'Bytes Sent to Replica/sec'
        )

  - query_name: mssql_wait_stats_averages
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'Page IO latch waits' THEN cntr_value END) AS page_io_latch_waits_ms,
        MAX(CASE WHEN counter_name = 'Network IO waits' THEN cntr_value END) AS network_io_waits_ms
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Wait Statistics%'
        AND instance_name = 'Average wait time (ms)'
        AND counter_name IN ('Page IO latch waits', 'Network IO waits')

  - query_name: mssql_database_info_query
    query: |
      DECLARE @is_ha_instance BIT = CASE WHEN EXISTS (SELECT 1 FROM sys.availability_groups) THEN 1 ELSE 0 END;
      SELECT
          d.name AS database_name,
          d.state,
          d.state_desc,
          @is_ha_instance AS is_ha_instance,
          CASE WHEN ag_db.replica_id IS NOT NULL THEN 1 ELSE 0 END AS is_in_ag,
          1 AS value
      FROM sys.databases d
      LEFT JOIN sys.dm_hadr_database_replica_states ag_db
        ON is_local = 1 AND d.database_id = ag_db.database_id
      WHERE d.is_distributor <> 1;

  - query_name: mssql_ag_database_out_of_sync_query
    query: |
      SELECT DISTINCT
          ar.replica_server_name AS AR_REPLICA_SERVER_NAME,
          drcs.database_name AS DATABASE_NAME,
          drs.synchronization_state_desc AS SYNC_STATE_DESC,
          COALESCE(drs.database_state_desc, '') AS DB_STATE_DESC,
          1 AS value
      FROM sys.availability_replicas ar
      JOIN sys.dm_hadr_database_replica_states drs
        ON ar.replica_id = drs.replica_id
      JOIN sys.dm_hadr_database_replica_cluster_states drcs
        ON drs.group_database_id = drcs.group_database_id
      WHERE drs.synchronization_state_desc <> 'SYNCHRONIZED';

  - query_name: mssql_last_logsweep_query
    query: |
      SELECT
          COALESCE(STRING_AGG(sub.DATABASE_NAME, ', ') WITHIN GROUP (ORDER BY sub.DATABASE_NAME), '') AS OVERDUE_DATABASES,
          COALESCE(STRING_AGG(sub.LAST_LOGSWEEP_DATE, ', ') WITHIN GROUP (ORDER BY sub.DATABASE_NAME), '') AS LAST_LOGSWEEP_DATES,
          COALESCE(MAX(sub.minutes_since_last_logbackup), 0) AS max_minutes_overdue
      FROM (
          SELECT
              d.name AS DATABASE_NAME,
              COALESCE(FORMAT(MAX(bs.backup_finish_date), 'yyyy-MM-dd HH:mm:ss'), 'Never Backed Up') AS LAST_LOGSWEEP_DATE,
              COALESCE(DATEDIFF(MINUTE, MAX(bs.backup_finish_date), GETDATE()), -1) AS minutes_since_last_logbackup
          FROM sys.databases d
          LEFT JOIN msdb.dbo.backupset bs
               ON d.name = bs.database_name
               AND bs.type = 'L'
               AND bs.backup_finish_date IS NOT NULL
          WHERE d.database_id > 4
            AND d.state_desc = 'ONLINE'
          GROUP BY d.name
      ) AS sub
      WHERE sub.minutes_since_last_logbackup > 240
      HAVING STRING_AGG(sub.DATABASE_NAME, ', ') IS NOT NULL

  - query_name: mssql_lock_counters
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'Lock Wait Time (ms)' THEN cntr_value END) AS lock_wait_time_ms,
        MAX(CASE WHEN counter_name = 'Lock Waits/sec' THEN cntr_value END) AS lock_waits
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Locks%'
        AND instance_name = '_Total'
        AND counter_name IN ('Lock Wait Time (ms)', 'Lock Waits/sec')

  - query_name: mssql_access_methods_counters
    query: |
      SELECT
        MAX(CASE WHEN counter_name = 'Full Scans/sec' THEN cntr_value END) AS full_scans,
        MAX(CASE WHEN counter_name = 'Forwarded Records/sec' THEN cntr_value END) AS forwarded_records,
        MAX(CASE WHEN counter_name = 'Index Searches/sec' THEN cntr_value END) AS index_searches,
        MAX(CASE WHEN counter_name = 'Page Splits/sec' THEN cntr_value END) AS page_splits,
        MAX(CASE WHEN counter_name = 'Workfiles Created/sec' THEN cntr_value END) AS workfiles_created,
        MAX(CASE WHEN counter_name = 'Worktables Created/sec' THEN cntr_value END) AS worktables_created,
        MAX(CASE WHEN counter_name = 'Table Lock Escalations/sec' THEN cntr_value END) AS table_lock_escalations
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Access Methods%'
        AND counter_name IN (
          'Full Scans/sec',
          'Forwarded Records/sec',
          'Index Searches/sec',
          'Page Splits/sec',
          'Workfiles Created/sec',
          'Worktables Created/sec',
          'Table Lock Escalations/sec'
        )

  - query_name: mssql_database_log_counters
    query: |
      SELECT
        RTRIM(instance_name) AS db,
        MAX(CASE WHEN counter_name = 'Log Bytes Flushed/sec' THEN cntr_value END) AS log_bytes_flushed,
        MAX(CASE WHEN counter_name = 'Log Flush Wait Time' THEN cntr_value END) AS log_flush_wait_time_ms,
        MAX(CASE WHEN counter_name = 'Log Flush Waits/sec' THEN cntr_value END) AS log_flush_waits,
        MAX(CASE WHEN counter_name = 'Log Flushes/sec' THEN cntr_value END) AS log_flushes
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:Databases%'
        AND instance_name NOT IN ('_Total', 'mssqlsystemresource')
        AND counter_name IN (
          'Log Bytes Flushed/sec',
          'Log Flush Wait Time',
          'Log Flush Waits/sec',
          'Log Flushes/sec'
        )
      GROUP BY RTRIM(instance_name)

  - query_name: mssql_sql_errors
    query: |
      SELECT
        RTRIM(instance_name) AS error_type,
        cntr_value AS errors
      FROM sys.dm_os_performance_counters WITH (NOLOCK)
      WHERE object_name LIKE '%:SQL Errors%'
        AND counter_name = 'Errors/sec'

  - query_name: mssql_active_requests_count
    query: |
      SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;
      SELECT COUNT(*) AS active_requests_count
      FROM sys.dm_exec_sessions AS s
      LEFT JOIN sys.dm_exec_requests AS r
        ON r.session_id = s.session_id
      WHERE s.session_id <> @@SPID
        AND (
          s.session_id IN (
            SELECT ri.blocking_session_id
            FROM sys.dm_exec_requests AS ri
            WHERE ri.blocking_session_id IS NOT NULL
              AND ri.blocking_session_id <> 0
          )
          OR (r.blocking_session_id IS NOT NULL AND r.blocking_session_id <> 0)
          OR (s.session_id > 50 AND r.session_id IS NOT NULL AND s.status <> 'sleeping')
          OR (s.session_id > 50 AND s.open_transaction_count <> 0)
        )

  - query_name: mssql_logsaver
    query: |
      SET NOCOUNT ON
      SET XACT_ABORT ON
      SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED

      DECLARE
        @log_used_pct_threshold tinyint = 80,
        @log_used_gb_threshold int = 100,
        @threshold_condition varchar(5) = 'or', /* and | or */
        @databases varchar(max) = NULL, /* Comma separated list of databases. -ve (negative) if database has to be excluded */
        @skip_autogrowth_validation bit = 0,
        @kill_spids bit = 0,
        @verbose tinyint = 0 /* 1 => messages, 2 => messages + table results */

      DECLARE @_start_time datetime2;
      SET @_start_time = SYSDATETIME();

      IF @verbose >= 1
        PRINT '('+convert(varchar, getdate(), 21)+') Declaring local variables..';

      DECLARE @_spid int
      DECLARE @_sql varchar(max)
      DECLARE @_params nvarchar(max)
      DECLARE @_email_body varchar(max) = ''
      DECLARE @_email_subject nvarchar(255)
      DECLARE @_log_used_pct decimal(38,2)
      DECLARE @_error varchar(8000)
      DECLARE @_is_pct_threshold_valid bit = 0;
      DECLARE @_is_gb_threshold_valid bit = 0;
      DECLARE @_thresholds_violated bit = 0;
      DECLARE @_exists_valid_autogrowing_file bit = 0;
      DECLARE @_transaction_start_time datetime;

      DECLARE @_tab nchar(1) = CHAR(9);

      declare @c_database_name sysname;
      declare @c_recovery_model varchar(50);
      declare @c_log_reuse_wait_desc varchar(125);
      declare @c_log_size_mb numeric(12,2);
      declare @c_log_used_pct numeric(6,2);

      IF @verbose >= 1
        PRINT '('+convert(varchar, getdate(), 21)+') Creating #temp tables..';

      IF OBJECT_ID('tempdb..#logspace') IS NOT NULL
        DROP TABLE #logspace;
      CREATE TABLE #logspace
      (	[database_name] sysname,
        log_size_mb   decimal(38,2),
        log_used_pct  decimal(38,2),
        log_status    int
      );

      IF OBJECT_ID('tempdb..#dbcc_opentran') IS NOT NULL
        DROP TABLE #dbcc_opentran;
      CREATE TABLE #dbcc_opentran
      (	[database_name]  sysname NULL,
        transaction_property varchar(100) NULL,
        transaction_property_value varchar(1000) NULL
      );

      IF OBJECT_ID('tempdb..#log_space_consumers') IS NOT NULL
        DROP TABLE #log_space_consumers;
      CREATE TABLE #log_space_consumers
      (
        [collection_time] datetime2 not null
        ,[database_name] sysname not null
        ,[recovery_model] varchar(20) not null
        ,[log_reuse_wait_desc] varchar(125) not null
        ,[log_size_mb] decimal(20, 2) not null
        ,[log_used_mb] decimal(20, 2) not null
        ,[exists_valid_autogrowing_file] bit null
        ,[log_used_pct] decimal(10, 2) default 0.0 not null
        ,[thresholds_violated] bit default 0 not null
        ,[threshold_condition] varchar(5) not null
        ,[log_used_pct_threshold] decimal(10,2) not null
        ,[log_used_gb_threshold] decimal(20,2) null
        ,[is_pct_threshold_valid] bit default 0 not null
        ,[is_gb_threshold_valid] bit default 0 not null
        ,[spid] int null
        ,[transaction_start_time] datetime null
        ,[login_name] sysname null
        ,[program_name] sysname null
        ,[host_name] sysname null
        ,[host_process_id] int null
        ,[command] varchar(16) null
        ,[sql_text] varchar(max) null
      );

      -- Create Temporary Tables
      IF OBJECT_ID('tempdb..#db_list_from_params') IS NOT NULL
        DROP TABLE #db_list_from_params;
      CREATE TABLE #db_list_from_params ([database_name] sysname, [skip_db] bit);

      IF OBJECT_ID('tempdb..#db_list') IS NOT NULL
        DROP TABLE #db_list;
      CREATE TABLE #db_list ([database_name] sysname, [recovery_model] varchar(50), [log_reuse_wait_desc] varchar(125));

      IF @databases IS NOT NULL
      BEGIN
        IF @verbose >= 1
          PRINT '('+convert(varchar, getdate(), 21)+') Extracting database names from ('+@databases+') parameter value..';
        ;WITH t1([database_name], [databases]) AS
        (
          SELECT	CAST(LEFT(@databases, CHARINDEX(',',@databases+',')-1) AS VARCHAR(500)) as [database_name],
              STUFF(@databases, 1, CHARINDEX(',',@databases+','), '') as [databases]
          --
          UNION ALL
          --
          SELECT	CAST(LEFT([databases], CHARINDEX(',',[databases]+',')-1) AS VARChAR(500)) AS [database_name],
              STUFF([databases], 1, CHARINDEX(',',[databases]+','), '')  as [databases]
          FROM t1
          WHERE [databases] > ''
        )
        INSERT #db_list_from_params ([database_name], [skip_db])
        SELECT	[database_name] = case when left(ltrim(rtrim([database_name])),1) = '-' then RIGHT(ltrim(rtrim([database_name])),len(ltrim(rtrim([database_name])))-1) else ltrim(rtrim([database_name])) end, 
            [skip_db] = case when left(ltrim(rtrim([database_name])),1) = '-' then 1 else 0 end
        FROM t1
        OPTION (MAXRECURSION 32000);

        IF @verbose >= 2
        BEGIN
          PRINT '('+convert(varchar, getdate(), 21)+') select * from #db_list_from_params..'
          select running_query, t.*
          from #db_list_from_params t
          full outer join (values ('#db_list_from_params') )dummy(running_query) on 1 = 1
        END
      END

      IF @databases IS NOT NULL
      BEGIN
        IF @verbose >= 1
          PRINT '('+convert(varchar, getdate(), 21)+') Extracting database names from ('+@databases+') parameter value..';

        IF EXISTS (SELECT 1/0 FROM #db_list_from_params p WHERE p.skip_db = 0)
        BEGIN
          IF @verbose >= 1
            PRINT '('+convert(varchar, getdate(), 21)+') Databases parameter has databases for Inclusion logic. Working on same..';

          INSERT #db_list ([database_name], [recovery_model], [log_reuse_wait_desc])
          SELECT d.name, d.recovery_model_desc, d.[log_reuse_wait_desc]
          FROM sys.databases d
          INNER JOIN #db_list_from_params pl
            ON pl.database_name = d.name
          WHERE	1=1
            AND	d.state_desc = 'ONLINE'
            AND pl.skip_db = 0;
        END
        ELSE
        BEGIN
          IF @verbose >= 1
            PRINT '('+convert(varchar, getdate(), 21)+') Databases parameter has databases for Exclusion logic only. Working on same..';

          INSERT #db_list ([database_name], [recovery_model], [log_reuse_wait_desc])
          SELECT d.name, d.recovery_model_desc, d.[log_reuse_wait_desc]
          FROM sys.databases d
          WHERE	1=1
            AND	d.state_desc = 'ONLINE'
            AND d.name NOT IN (SELECT pl.database_name FROM #db_list_from_params pl WHERE pl.skip_db = 1);
        END
      END
      ELSE
      BEGIN
        IF @verbose >= 1
          PRINT '('+convert(varchar, getdate(), 21)+') Databases parameter not provided. Working on #db_list..';

        INSERT #db_list ([database_name], [recovery_model], [log_reuse_wait_desc])
        SELECT d.name, d.recovery_model_desc, d.[log_reuse_wait_desc]
        FROM sys.databases d
        WHERE	1=1
          AND	d.state_desc = 'ONLINE';
      END

      IF @verbose >= 2
      BEGIN
        PRINT '('+convert(varchar, getdate(), 21)+') select * from #db_list..'
        select running_query, t.*
        from #db_list t
        full outer join (values ('#db_list') )dummy(running_query) on 1 = 1
      END

      IF @verbose >= 1
        PRINT '('+convert(varchar, getdate(), 21)+') Populate #logspace using SQLPERF(LOGSPACE)..'
      INSERT INTO #logspace ([database_name], log_size_mb, log_used_pct, log_status)
        EXEC ('DBCC SQLPERF(LOGSPACE) WITH NO_INFOMSGS');

      IF @verbose >= 2
      BEGIN
        PRINT '('+convert(varchar, getdate(), 21)+') select * from #logspace join #db_list..'
        select running_query, t.*, dl.*
        from #logspace t
        join #db_list dl on dl.database_name = t.database_name
        full outer join (values ('#logspace + #db_list') )dummy(running_query) on 1 = 1
      END

      IF @verbose >= 1
        PRINT '('+convert(varchar, getdate(), 21)+') Start a cursor, and loop through each database..'

      DECLARE cur_databases CURSOR LOCAL FORWARD_ONLY FOR
        SELECT dl.database_name, dl.recovery_model, dl.log_reuse_wait_desc,
            ls.log_size_mb, ls.log_used_pct
        FROM #db_list dl
        JOIN #logspace ls
          ON ls.database_name = dl.database_name;

      OPEN cur_databases;
      FETCH NEXT FROM cur_databases INTO @c_database_name, @c_recovery_model, @c_log_reuse_wait_desc, @c_log_size_mb, @c_log_used_pct;

      WHILE @@FETCH_STATUS = 0
      BEGIN
        SET @_is_pct_threshold_valid = 0;
        SET @_is_gb_threshold_valid = 0;
        SET @_thresholds_violated = 0;
        SET @_exists_valid_autogrowing_file = 0;
        SET @_spid = NULL;
        SET @_transaction_start_time = NULL;
        TRUNCATE TABLE #dbcc_opentran;

        IF @verbose >= 1
          PRINT '('+convert(varchar, getdate(), 21)+') Working on database ['+@c_database_name+']..';

        IF @verbose >= 1
          PRINT @_tab+@_tab+'Validate if a valid auto-growing log file exists..'
        IF EXISTS (	SELECT * FROM sys.master_files mf
              WHERE mf.database_id = DB_ID(@c_database_name) AND mf.type_desc = 'LOG'
              AND mf.growth > 0 AND mf.max_size <> 0 -- auto growth is enabled
              AND (	mf.max_size = -1
                OR	((mf.max_size*8.0/1024)*@log_used_pct_threshold/100.0) > @c_log_size_mb -- @log_used_pct_threshold of max size is not reached
                )
            )
        BEGIN
          SET @_exists_valid_autogrowing_file = 1;
        END

        -- Validate if % thresholds are crossed
        IF	(	@log_used_pct_threshold IS NOT NULL
          AND	@c_log_used_pct >= @log_used_pct_threshold
          AND (	@_exists_valid_autogrowing_file = 0
            OR	@skip_autogrowth_validation = 1
            )
          )
        BEGIN
          SET @_is_pct_threshold_valid = 1;
        END

        IF (@log_used_gb_threshold IS NOT NULL) AND ((@c_log_size_mb * @c_log_used_pct / 100.0) > (@log_used_gb_threshold*1024.0))
        BEGIN
          SET @_is_gb_threshold_valid = 1;
        END

        SET @_thresholds_violated = (CASE	WHEN @threshold_condition = 'and' and (@_is_pct_threshold_valid = 1 and @_is_gb_threshold_valid = 1) THEN 1
                          WHEN @threshold_condition = 'or' and (@_is_pct_threshold_valid = 1 OR @_is_gb_threshold_valid = 1) THEN 1
                          ELSE 0
                          END);

        IF (@_thresholds_violated = 1) AND (@verbose >= 1)
          PRINT @_tab+@_tab+'Threshold broken for database ['+@c_database_name+']..';

        IF @verbose >= 1
        BEGIN
          PRINT @_tab+@_tab+'@c_log_reuse_wait_desc = '+ @c_log_reuse_wait_desc;
          PRINT @_tab+@_tab+'@c_log_size_mb = '+ convert(varchar,@c_log_size_mb);
          PRINT @_tab+@_tab+'@c_log_used_pct = '+ convert(varchar,@c_log_used_pct);
          PRINT @_tab+@_tab+'@_exists_valid_autogrowing_file = '+ convert(varchar,@_exists_valid_autogrowing_file);
          PRINT @_tab+@_tab+'@_is_pct_threshold_valid = '+ convert(varchar,@_is_pct_threshold_valid);
          PRINT @_tab+@_tab+'@_is_gb_threshold_valid = '+ convert(varchar,@_is_gb_threshold_valid);
          --PRINT @_tab+@_tab+'@_thresholds_violated = '+ convert(varchar,@_thresholds_violated);
        END

        -- If Thresholds are met, then find out oldest transaction details
        IF @_thresholds_violated = 1
        BEGIN
          IF @verbose >= 1
            PRINT @_tab+@_tab+'Find longest open transaction using DBCC OPENTRAN..';
          SET @_sql = 'DBCC OPENTRAN(''' + @c_database_name + ''') WITH TABLERESULTS, NO_INFOMSGS;';
          INSERT INTO #dbcc_opentran (transaction_property, transaction_property_value)
          EXEC (@_sql);

          IF @verbose >= 2
          BEGIN
            PRINT @_tab+@_tab+' select * from #dbcc_opentran..'
            select running_query, [@c_database_name] = @c_database_name, t.*
            from #dbcc_opentran t
            full outer join (values ('#dbcc_opentran') )dummy(running_query) on 1 = 1
          END

          SELECT	@_spid = CASE WHEN transaction_property = 'OLDACT_SPID' THEN transaction_property_value ELSE @_spid END,
              @_transaction_start_time = CASE WHEN transaction_property = 'OLDACT_STARTTIME' THEN convert(datetime,transaction_property_value) ELSE @_transaction_start_time END
          FROM #dbcc_opentran
          WHERE transaction_property IN ('OLDACT_SPID','OLDACT_STARTTIME');
        END

        IF @verbose >= 1
          PRINT @_tab+@_tab+'Populate #log_space_consumers with log usage + transaction details..';

        INSERT INTO #log_space_consumers
        (	[collection_time], [database_name], [recovery_model], [log_reuse_wait_desc], [log_size_mb], [log_used_mb],
          [exists_valid_autogrowing_file], [log_used_pct], [log_used_pct_threshold], [log_used_gb_threshold], [spid],
          [transaction_start_time], [login_name], [program_name], [host_name], [host_process_id], [command], [sql_text],
          [is_pct_threshold_valid], [is_gb_threshold_valid], [threshold_condition],
          [thresholds_violated]
        )
        SELECT	[collection_time] = @_start_time,
            [database_name] = @c_database_name,
            [recovery_model] = @c_recovery_model,
            [log_reuse_wait_desc] = @c_log_reuse_wait_desc,
            [log_size_mb] = @c_log_size_mb,
            [log_used_mb] = convert(numeric(20,2), @c_log_size_mb*@c_log_used_pct/100.0),
            [exists_valid_autogrowing_file] = @_exists_valid_autogrowing_file,
            [log_used_pct] = @c_log_used_pct,
            [log_used_pct_threshold] = @log_used_pct_threshold,
            [log_used_gb_threshold] = @log_used_gb_threshold,
            [spid] = des.session_id,
            [transaction_start_time] = @_transaction_start_time,
            [login_name] = des.login_name,
            [program_name] = CASE	WHEN	des.program_name like 'SQLAgent - TSQL JobStep %'
                        THEN	(	select	top 1 'SQL Job = '+j.name
                              from msdb.dbo.sysjobs (nolock) as j
                              inner join msdb.dbo.sysjobsteps (nolock) AS js on j.job_id=js.job_id
                              where right(cast(js.job_id as nvarchar(50)),10) = RIGHT(substring(des.program_name,30,34),10)
                            ) + ' ( '+SUBSTRING(LTRIM(RTRIM(des.program_name)), CHARINDEX(': Step ',LTRIM(RTRIM(des.program_name)))+2,LEN(LTRIM(RTRIM(des.program_name)))-CHARINDEX(': Step ',LTRIM(RTRIM(des.program_name)))-2)+' )'
                        ELSE	des.program_name
                        END,
            [host_name] = des.[host_name],
            [host_process_id] = des.host_process_id,
            [command] = der.command,
            [sql_text] = est.text,
            [is_pct_threshold_valid] = @_is_pct_threshold_valid,
            [is_gb_threshold_valid] = @_is_gb_threshold_valid,
            [threshold_condition] = @threshold_condition,
            [thresholds_violated] = @_thresholds_violated
        FROM	#logspace t
        INNER JOIN #db_list dl
          ON	dl.database_name = t.database_name
          AND	dl.database_name = @c_database_name
        LEFT JOIN sys.dm_exec_sessions des
          ON	des.session_id = @_spid
          AND	dl.log_reuse_wait_desc IN ('ACTIVE_TRANSACTION')
        LEFT JOIN sys.dm_exec_requests der
          ON	der.session_id = des.session_id
        OUTER APPLY sys.dm_exec_sql_text(der.sql_handle) est
        WHERE	1=1;
          --AND	status <> 'background'
          --AND	loginame NOT IN ('sa', 'NT AUTHORITY\SYSTEM');

        -- If Thresholds are met, and ACTIVE_TRANSACTION is main issue, then take action if allowed.
        IF (@_thresholds_violated = 1) AND (@_spid IS NOT NULL) AND (@c_log_reuse_wait_desc = 'ACTIVE_TRANSACTION')
        BEGIN
          IF ( (@_spid <> 0 AND @_spid >= 50) AND (@c_log_reuse_wait_desc = 'ACTIVE_TRANSACTION') )
          BEGIN
            SET @_sql = 'KILL ' + CONVERT(varchar(30), @_spid) + ';'
            IF @verbose >= 1
              PRINT @_tab+@_tab+(CASE WHEN @kill_spids = 1 THEN 'Execute: ' ELSE 'DryRun: ' END)+@_sql;
          END
          ELSE
          BEGIN
            IF @verbose >= 1
              PRINT @_tab+@_tab+'Log space is NOT caused by active transaction. So no action taken.';
          END
        END
        ELSE IF (@_thresholds_violated = 1) AND (@c_log_reuse_wait_desc <> 'ACTIVE_TRANSACTION') AND (@verbose >= 1)
          PRINT @_tab+@_tab+'Log space is NOT caused by active transaction. So no action taken.';
        ELSE IF (@verbose >= 1)
          PRINT @_tab+@_tab+'No action required for database ['+@c_database_name+']..';

        FETCH NEXT FROM cur_databases INTO @c_database_name, @c_recovery_model, @c_log_reuse_wait_desc, @c_log_size_mb, @c_log_used_pct;
      END

      IF @verbose >= 2
      BEGIN
        PRINT '('+convert(varchar, getdate(), 21)+') select * from #log_space_consumers..'
        select running_query, t.*
        from #log_space_consumers t
        full outer join (values ('#log_space_consumers') )dummy(running_query) on 1 = 1
      END

      IF EXISTS (SELECT 1/0 FROM #log_space_consumers)
      BEGIN
        IF @verbose >= 1
          PRINT '('+convert(varchar, getdate(), 21)+') Return resultset from #log_space_consumers..'
        SELECT	[collection_time] = DATEDIFF_BIG(SECOND, '1970-01-01T00:00:00', CAST([collection_time] AS datetime2)),
                [database_name],
                [recovery_model] = COALESCE([recovery_model], ''),
                [log_reuse_wait_desc] = COALESCE([log_reuse_wait_desc], ''),
                [log_size_mb],
                [log_used_mb],
                [exists_valid_autogrowing_file] = CONVERT(int, COALESCE([exists_valid_autogrowing_file], 0)),
                [log_used_pct],
                [thresholds_violated] = CONVERT(int, COALESCE([thresholds_violated], 0)),
                [threshold_condition] = COALESCE([threshold_condition], ''),
                [log_used_pct_threshold],
                [log_used_gb_threshold] = COALESCE([log_used_gb_threshold], 0),
                [is_pct_threshold_valid] = CONVERT(int, COALESCE([is_pct_threshold_valid], 0)),
                [is_gb_threshold_valid] = CONVERT(int, COALESCE([is_gb_threshold_valid], 0)),
                [spid] = COALESCE(CONVERT(varchar(30), [spid]), ''),
                [transaction_start_time] = CASE WHEN [transaction_start_time] IS NULL THEN 0 ELSE DATEDIFF_BIG(SECOND, '1970-01-01T00:00:00', CAST([transaction_start_time] AS datetime2)) END,
                [login_name] = COALESCE([login_name], ''),
                [program_name] = COALESCE([program_name], ''),
                [host_name] = COALESCE([host_name], ''),
                [host_process_id] = COALESCE(CONVERT(varchar(30), [host_process_id]), ''),
                [command] = COALESCE([command], ''),
                [sql_text] = COALESCE(CONVERT(varchar(max), [sql_text]), '')
        FROM #log_space_consumers;
      END

      IF EXISTS (SELECT 1/0 FROM #log_space_consumers WHERE thresholds_violated = 1 and spid IS NOT NULL)
      BEGIN
        -- Get 1st spid to report about
        select @c_database_name = lsc.database_name, @_spid = lsc.spid
        from #log_space_consumers lsc
        where thresholds_violated = 1
        and spid IS NOT NULL
        order by spid
        offset 0 rows fetch next 1 row only;

        WHILE @@ROWCOUNT <> 0
        BEGIN
          SET @_email_subject  = NULL;
          SET @_email_body = NULL;

          SET @_email_body = 'The following SQL Server process ' + CASE WHEN @kill_spids = 1 THEN 'was' ELSE 'is' END + ' preventing the ['+@c_database_name+'] database transaction log from clearing. Please visit https://ajaydwivedi.com/go/logsaver to view killed database process history.' + CHAR(10) + CHAR(10);

          SELECT	@_email_subject = 'Log Saver: ' + CONVERT(nvarchar(255), SERVERPROPERTY('ServerName')) + ' - ' + QUOTENAME(@c_database_name),
              @_email_body = @_email_body +
                    '        current time: ' + CONVERT(varchar(100), collection_time, 121) + CHAR(10) +
                    '                spid: ' + CONVERT(varchar(30), spid) + CHAR(10) +
                    '     tran start time: ' + CONVERT(varchar(100), transaction_start_time, 121) + CHAR(10) +
                    '       database_name: ' + database_name + CHAR(10) +
                    '      recovery_model: ' + recovery_model + CHAR(10) +
                    ' log_reuse_wait_desc: ' + log_reuse_wait_desc + CHAR(10) +
                    '         log_size_gb: ' + CONVERT(varchar(100), log_size_mb/1024) + CHAR(10) +
                    '         log_used_gb: ' + CONVERT(varchar(100), log_used_mb/1024) + CHAR(10) +
                    '        log_used_pct: ' + CONVERT(varchar(100), log_used_pct) + CHAR(10) +
                    '          login_name: ' + login_name + CHAR(10) +
                    '        program_name: ' + program_name + CHAR(10) +
                    '           host_name: ' + host_name + CHAR(10) +
                    '     host_process_id: ' + CONVERT(varchar(30), host_process_id) + CHAR(10) +
                    '             command: ' + command + CHAR(10) +
                    '            sql_text: ' + LTRIM(REPLACE(REPLACE(REPLACE(LEFT(sql_text, 200), CHAR(10), ' '), CHAR(13), ' '), '  ', ' ')) + CHAR(10) 
          FROM   #log_space_consumers
          WHERE thresholds_violated = 1
          and spid = @_spid;

          IF @verbose > 0
          BEGIN
            PRINT CHAR(13)+CHAR(13)+@_email_subject;
            PRINT @_email_body;
          END

          select @c_database_name = lsc.database_name, @_spid = lsc.spid
          from #log_space_consumers lsc
          where thresholds_violated = 1
          and spid IS NOT NULL
          and lsc.spid > @_spid
          order by spid
          offset 0 rows fetch next 1 row only;
        END
      END
