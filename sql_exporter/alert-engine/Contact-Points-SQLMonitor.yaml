apiVersion: 1
contactPoints:
  - orgId: 1
    name: sqlmonitor-email
    receivers:
      - uid: sqlmonitoremail
        type: email
        settings:
          addresses: $SQLMONITOR_EMAIL_ADDRESSES
          singleEmail: false
        disableResolveMessage: false

  - orgId: 1
    name: sqlmonitor-slack
    receivers:
      - uid: sqlmonitorslack
        type: slack
        settings:
          recipient: $SQLMONITOR_SLACK_CHANNEL
          url: $SQLMONITOR_SLACK_WEBHOOK_URL
        disableResolveMessage: false

  - orgId: 1
    name: sqlmonitor-teams
    receivers:
      - uid: sqlmonitorteams
        type: teams
        settings:
          url: $SQLMONITOR_TEAMS_WEBHOOK_URL
        disableResolveMessage: false

  - orgId: 1
    name: sqlmonitor-default
    receivers:
      - uid: sqlmonitordefaultemail
        type: email
        settings:
          addresses: $SQLMONITOR_EMAIL_ADDRESSES
          singleEmail: false
        disableResolveMessage: false
      - uid: sqlmonitordefaultslack
        type: slack
        settings:
          recipient: $SQLMONITOR_SLACK_CHANNEL
          url: $SQLMONITOR_SLACK_WEBHOOK_URL
        disableResolveMessage: false
      - uid: sqlmonitordefaultteams
        type: teams
        settings:
          url: $SQLMONITOR_TEAMS_WEBHOOK_URL
        disableResolveMessage: false
