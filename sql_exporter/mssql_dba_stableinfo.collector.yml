# A collector defining standard metrics for Microsoft SQL Server.
#
# It is required that the SQL Server user has the following permissions:
#
#   GRANT VIEW ANY DEFINITION TO
#   GRANT VIEW SERVER STATE TO
#
collector_name: mssql_dba_stableinfo

# Similar to global.min_interval, but applies to the queries defined by this collector only.
min_interval: 10m

metrics:
  #
  # Collected using sys.databases
  #
  - metric_name: mssql_db__collection_time_utc
    type: gauge
    help: 'Collection time as Unix epoch seconds for sys.databases rows.'
    key_labels:
      - db_name
    values: [collection_time_utc]
    query_ref: mssql_sys_databases

  - metric_name: mssql_db__create_date
    type: gauge
    help: 'Database create date from sys.databases.'
    key_labels:
      - db_name
      - owner_sid
      - collation_name
      - service_broker_guid
      - replica_id
      - group_database_id
      - default_language_name
      - default_fulltext_language_name
      - physical_database_name
    values: [create_date]
    query_ref: mssql_sys_databases

  - metric_name: mssql_db__database_id
    type: gauge
    help: 'sys.databases.database_id value.'
    key_labels:
      - db_name
    values: [database_id]
    query_ref: mssql_sys_databases

  - metric_name: mssql_db__source_database_id
