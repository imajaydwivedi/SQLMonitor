        CAST(d.is_ledger_on AS bigint) AS is_ledger_on,
        CAST(d.is_change_feed_enabled AS bigint) AS is_change_feed_enabled,
        CAST(d.is_data_lake_replication_enabled AS bigint) AS is_data_lake_replication_enabled,
        CAST(d.is_event_stream_enabled AS bigint) AS is_event_stream_enabled,
        d.data_compaction AS data_compaction,
        d.data_lake_log_publishing AS data_lake_log_publishing,
        CAST(d.is_vorder_enabled AS bigint) AS is_vorder_enabled,
        CAST(d.is_proactive_statistics_refresh_on AS bigint) AS is_proactive_statistics_refresh_on,
        CAST(d.is_optimized_locking_on AS bigint) AS is_optimized_locking_on,
        COALESCE(d.user_access_desc, N'') AS user_access_desc,
        COALESCE(d.state_desc, N'') AS state_desc,
        COALESCE(d.snapshot_isolation_state_desc, N'') AS snapshot_isolation_state_desc,
        COALESCE(d.recovery_model_desc, N'') AS recovery_model_desc,
        COALESCE(d.page_verify_option_desc, N'') AS page_verify_option_desc,
        COALESCE(d.containment_desc, N'') AS containment_desc,
        COALESCE(d.delayed_durability_desc, N'') AS delayed_durability_desc,
        COALESCE(d.catalog_collation_type_desc, N'') AS catalog_collation_type_desc,
        COALESCE(d.data_compaction_desc, N'') AS data_compaction_desc,
        COALESCE(d.data_lake_log_publishing_desc, N'') AS data_lake_log_publishing_desc
      FROM sys.databases AS d
      ORDER BY d.name

  - query_name: mssql_sys_configurations
    query: |
      SELECT
        CAST(DATEDIFF_BIG(second, CONVERT(datetime2, '19700101'), GETUTCDATE()) AS bigint) as collection_time_utc,
        name AS config_name,
        CAST(value AS int) AS config_value,
        CAST(value_in_use AS int) AS config_value_in_use,
        description AS config_description
      FROM sys.configurations
      ORDER BY name