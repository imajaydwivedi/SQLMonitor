queries:
  - query_name: mssql_sys_databases
    query: |
      SELECT
        CAST(DATEDIFF_BIG(second, CONVERT(datetime2, '19700101'), GETUTCDATE()) AS bigint) as collection_time_utc,
        d.name AS db_name,
        COALESCE(sys.fn_varbintohexstr(d.owner_sid), N'') AS owner_sid,
        CAST(DATEDIFF_BIG(second, CONVERT(datetime2, '19700101'), d.create_date) AS bigint) AS create_date,
        COALESCE(d.collation_name, N'') AS collation_name,
        COALESCE(CONVERT(nvarchar(36), d.service_broker_guid), N'') AS service_broker_guid,
        COALESCE(CONVERT(nvarchar(36), d.replica_id), N'') AS replica_id,
        COALESCE(CONVERT(nvarchar(36), d.group_database_id), N'') AS group_database_id,
        COALESCE(d.default_language_name, N'') AS default_language_name,
        COALESCE(d.default_fulltext_language_name, N'') AS default_fulltext_language_name,
        COALESCE(d.physical_database_name, N'') AS physical_database_name,
        d.database_id AS database_id,
        d.source_database_id AS source_database_id,
        d.compatibility_level AS compatibility_level,
        d.user_access AS user_access,
        CAST(d.is_read_only AS bigint) AS is_read_only,
        CAST(d.is_auto_close_on AS bigint) AS is_auto_close_on,
