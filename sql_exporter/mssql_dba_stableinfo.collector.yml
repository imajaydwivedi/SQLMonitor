        d.two_digit_year_cutoff AS two_digit_year_cutoff,
        d.containment AS containment,
        d.target_recovery_time_in_seconds AS target_recovery_time_in_seconds,
        d.delayed_durability AS delayed_durability,
        CAST(d.is_memory_optimized_elevate_to_snapshot_on AS bigint) AS is_memory_optimized_elevate_to_snapshot_on,
        CAST(d.is_federation_member AS bigint) AS is_federation_member,
