# SQL Agent job activity metrics for SQLMonitor.
#
# Required permissions (on msdb):
#
#   GRANT SELECT ON OBJECT::msdb.dbo.sysjobs                TO <login>;
#   GRANT SELECT ON OBJECT::msdb.dbo.sysjobhistory          TO <login>;
#   GRANT SELECT ON OBJECT::msdb.dbo.sysjobactivity         TO <login>;
#   GRANT SELECT ON OBJECT::msdb.dbo.sysjobschedules        TO <login>;
#   GRANT SELECT ON OBJECT::msdb.dbo.sysschedules           TO <login>;
#   GRANT SELECT ON OBJECT::msdb.dbo.syscategories          TO <login>;
#
collector_name: mssql_sqlagent_jobs

min_interval: 1m

metrics:
  - metric_name: mssql_sqlagent_job__enabled
    type: gauge
    help: 'Whether the SQL Agent job is enabled (1) or disabled (0).'
    key_labels: [job_name, job_id, category_name, owner_name]
    values: [enabled]
    query_ref: mssql_sqlagent_jobs_latest

  - metric_name: mssql_sqlagent_job__last_run_outcome
    type: gauge
    help: 'Last run outcome code: 0=Failed, 1=Succeeded, 2=Retry, 3=Canceled, 5=Unknown/no-history.'
    key_labels: [job_name, job_id, category_name, owner_name, last_run_outcome_desc]
    values: [last_run_outcome]
    query_ref: mssql_sqlagent_jobs_latest

  - metric_name: mssql_sqlagent_job__last_run_duration_seconds
    type: gauge
    help: 'Duration (seconds) of the last completed run of the job.'
    key_labels: [job_name, job_id]
    values: [last_run_duration_seconds]
    query_ref: mssql_sqlagent_jobs_latest

  - metric_name: mssql_sqlagent_job__last_run_end_time_utc
    type: gauge
    help: 'Unix epoch seconds when the last completed run of the job ended. 0 if no history.'
    key_labels: [job_name, job_id]
    values: [last_run_end_time_utc]
    query_ref: mssql_sqlagent_jobs_latest

  - metric_name: mssql_sqlagent_job__next_run_time_utc
    type: gauge
    help: 'Unix epoch seconds for the next scheduled run of the job. 0 if unscheduled.'
    key_labels: [job_name, job_id]
    values: [next_run_time_utc]
    query_ref: mssql_sqlagent_jobs_latest

  - metric_name: mssql_sqlagent_job__is_running
    type: gauge
    help: 'Whether the SQL Agent job is currently running (1) or idle (0).'
    key_labels: [job_name, job_id]
    values: [is_running]
    query_ref: mssql_sqlagent_jobs_latest

  - metric_name: mssql_sqlagent_job__step_failures_last_24h
    type: gauge
    help: 'Count of job step failures (run_status=0, step_id>0) in the last 24 hours.'
    key_labels: [job_name, job_id]
    values: [step_failures_last_24h]
    query_ref: mssql_sqlagent_jobs_latest

queries:
  # NOTE: sql_exporter (go-mssqldb) only reads the FIRST result-set from a
  # batch and treats `SELECT INTO #tmp` statements as zero-column resultsets
  # that interleave with the final SELECT -- which causes silent scrape
  # failures. So this query is deliberately a SINGLE SELECT using derived
  # tables instead of temp tables.
  - query_name: mssql_sqlagent_jobs_latest
    query: |
      SELECT job_name      = CAST(j.name AS nvarchar(256)),
             job_id        = CONVERT(nvarchar(36), j.job_id),
             category_name = ISNULL(c.name, N''),
             owner_name    = ISNULL(SUSER_SNAME(j.owner_sid), N''),
             enabled       = CAST(j.enabled AS int),
             last_run_outcome      = ISNULL(lo.run_status, 5),
             last_run_outcome_desc = CASE ISNULL(lo.run_status, 5)
                                       WHEN 0 THEN N'Failed'
                                       WHEN 1 THEN N'Succeeded'
                                       WHEN 2 THEN N'Retry'
                                       WHEN 3 THEN N'Canceled'
                                       ELSE N'Unknown' END,
             last_run_duration_seconds = ISNULL(lo.run_seconds, 0),
             last_run_end_time_utc = CAST(ISNULL(
               DATEDIFF_BIG(second,
                 CONVERT(datetime2, '19700101'),
                 DATEADD(mi, DATEDIFF(mi, GETDATE(), GETUTCDATE()), lo.run_end_dt)), 0) AS bigint),
             next_run_time_utc     = CAST(ISNULL(
               DATEDIFF_BIG(second,
                 CONVERT(datetime2, '19700101'),
                 DATEADD(mi, DATEDIFF(mi, GETDATE(), GETUTCDATE()), nr.next_run_dt)), 0) AS bigint),
             is_running            = ISNULL(r.is_running, 0),
             step_failures_last_24h = ISNULL(sf.failures_24h, 0)
      FROM msdb.dbo.sysjobs j
      LEFT JOIN msdb.dbo.syscategories c
             ON c.category_id = j.category_id
      LEFT JOIN (
             SELECT job_id, run_status, run_end_dt, run_seconds
             FROM (
               SELECT job_id, run_status,
                      run_end_dt = msdb.dbo.agent_datetime(run_date, run_time),
                      run_seconds = (run_duration / 10000) * 3600
                                  + ((run_duration / 100) % 100) * 60
                                  + (run_duration % 100),
                      rn = ROW_NUMBER() OVER (
                             PARTITION BY job_id
                             ORDER BY run_date DESC, run_time DESC, instance_id DESC)
               FROM msdb.dbo.sysjobhistory
               WHERE step_id = 0
             ) x
             WHERE rn = 1
           ) lo ON lo.job_id = j.job_id
      LEFT JOIN (
             SELECT h.job_id, failures_24h = COUNT(*)
             FROM msdb.dbo.sysjobhistory h
             WHERE h.step_id > 0 AND h.run_status = 0
               AND msdb.dbo.agent_datetime(h.run_date, h.run_time)
                   >= DATEADD(hour, -24, GETDATE())
             GROUP BY h.job_id
           ) sf ON sf.job_id = j.job_id
      LEFT JOIN (
             SELECT a.job_id, is_running = 1
             FROM msdb.dbo.sysjobactivity a
             INNER JOIN (
               SELECT job_id, max_ts = MAX(session_id)
               FROM msdb.dbo.sysjobactivity GROUP BY job_id
             ) m ON m.job_id = a.job_id AND m.max_ts = a.session_id
             WHERE a.start_execution_date IS NOT NULL
               AND a.stop_execution_date IS NULL
           ) r ON r.job_id = j.job_id
      LEFT JOIN (
             SELECT js.job_id,
                    next_run_dt = MIN(msdb.dbo.agent_datetime(
                                    NULLIF(js.next_run_date, 0),
                                    NULLIF(js.next_run_time, 0)))
             FROM msdb.dbo.sysjobschedules js
             INNER JOIN msdb.dbo.sysschedules s
                     ON s.schedule_id = js.schedule_id
             WHERE s.enabled = 1 AND js.next_run_date > 0
             GROUP BY js.job_id
           ) nr ON nr.job_id = j.job_id;
