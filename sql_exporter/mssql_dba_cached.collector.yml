# A collector defining standard metrics for Microsoft SQL Server.
#
# It is required that the SQL Server user has the following permissions:
#
#   GRANT VIEW ANY DEFINITION TO
#   GRANT VIEW SERVER STATE TO
#
collector_name: mssql_dba_cached

# Similar to global.min_interval, but applies to the queries defined by this collector only.
min_interval: 2m

metrics:

  #
  # Collected from sys.dm_os_wait_stats
  #
  - metric_name: mssql_waits__wait_time_seconds
    type: counter
    help: 'Total wait time in seconds by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [wait_time_seconds]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__resource_time_seconds
    type: counter
    help: 'Total resource wait time in seconds by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [resource_time_seconds]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__signal_time_seconds
    type: counter
    help: 'Total signal wait time in seconds by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [signal_time_seconds]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__waiting_tasks_count
    type: counter
    help: 'Total waiting tasks by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [waiting_tasks_count]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__wait_percentage
    type: counter
    help: 'Percentage of wait time by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [wait_percentage]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__wait_rank_no
    type: counter
    help: 'Rank of wait time by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [wait_rank_no]
    query_ref: mssql_os_wait_stats

  # - metric_name: mssql_diskspace__capacity_mb
  #   type: gauge
  #   help: 'Disk capacity in megabytes.'
  #   key_labels:
  #     - host_name
  #     - disk_volume
  #     # - label
  #     - filesystem
  #   values: [capacity_mb]
  #   query_ref: mssql_diskspace

  # - metric_name: mssql_diskspace__free_mb
  #   type: gauge
  #   help: 'Disk free space in megabytes.'
  #   key_labels:
  #     - host_name
  #     - disk_volume
  #     # - label
  #     - filesystem
  #   values: [free_mb]
  #   query_ref: mssql_diskspace

  # - metric_name: mssql_diskspace__used_mb
  #   type: gauge
  #   help: 'Disk used space in megabytes.'
  #   key_labels:
  #     - host_name
  #     - disk_volume
  #     # - label
  #     - filesystem
  #   values: [used_mb]
  #   query_ref: mssql_diskspace

  - metric_name: mssql_virtualfilestats__sample_ms
    type: counter
    help: 'Virtual file stats sample age in milliseconds for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [sample_ms]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__num_of_reads
    type: counter
    help: 'Total reads for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [num_of_reads]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__num_of_bytes_read
    type: counter
    help: 'Total bytes read for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [num_of_bytes_read]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__io_stall_read_ms
    type: counter
    help: 'Total read stall time in milliseconds for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [io_stall_read_ms]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__io_stall_queued_read_ms
    type: counter
    help: 'Total queued read stall time in milliseconds for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [io_stall_queued_read_ms]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__num_of_writes
    type: counter
    help: 'Total writes for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [num_of_writes]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__num_of_bytes_written
    type: counter
    help: 'Total bytes written for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [num_of_bytes_written]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__io_stall_write_ms
    type: counter
    help: 'Total write stall time in milliseconds for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [io_stall_write_ms]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__io_stall_queued_write_ms
    type: counter
    help: 'Total queued write stall time in milliseconds for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [io_stall_queued_write_ms]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__io_stall
    type: counter
    help: 'Total I/O stall time in milliseconds for the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [io_stall]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__size_on_disk_bytes
    type: gauge
    help: 'Current on-disk size in bytes for the SQL Server file.'
    key_labels: [file_location, database_name, file_logical_name, disk_volume, disk_filesystem]
    values: [size_on_disk_bytes]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__disk_capacity_mb
    type: gauge
    help: 'Disk capacity in megabytes for the volume hosting the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [disk_capacity_mb]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__disk_free_mb
    type: gauge
    help: 'Disk free space in megabytes for the volume hosting the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [disk_free_mb]
    query_ref: mssql_virtualfilestats

  - metric_name: mssql_virtualfilestats__disk_used_mb
    type: gauge
    help: 'Disk used space in megabytes for the volume hosting the SQL Server file.'
    key_labels: [file_location, database_name, disk_volume]
    values: [disk_used_mb]
    query_ref: mssql_virtualfilestats

queries:
  - query_name: mssql_os_wait_stats
    query: |
      SELECT
        [wait_type],
        [wait_time_ms] / 1000.0 AS [wait_time_seconds],
        ([wait_time_ms] - [signal_wait_time_ms]) / 1000.0 AS [resource_time_seconds],
        [signal_wait_time_ms] / 1000.0 AS [signal_time_seconds],
        [waiting_tasks_count],
        100.0 * [wait_time_ms] / SUM([wait_time_ms]) OVER() AS [wait_percentage],
        ROW_NUMBER() OVER (ORDER BY [wait_time_ms] DESC) AS [wait_rank_no]
      FROM sys.dm_os_wait_stats
      WHERE [wait_type] NOT IN (
        N'BROKER_EVENTHANDLER', N'BROKER_RECEIVE_WAITFOR', N'BROKER_TASK_STOP', N'BROKER_TO_FLUSH', N'BROKER_TRANSMITTER', N'CHECKPOINT_QUEUE', N'CHKPT', 
        N'CLR_AUTO_EVENT', N'CLR_MANUAL_EVENT', N'CLR_SEMAPHORE', N'DBMIRROR_DBM_EVENT', N'DBMIRROR_EVENTS_QUEUE', N'DBMIRROR_WORKER_QUEUE', 
        N'DBMIRRORING_CMD', N'DIRTY_PAGE_POLL', N'DISPATCHER_QUEUE_SEMAPHORE', N'EXECSYNC', N'FSAGENT', N'FT_IFTS_SCHEDULER_IDLE_WAIT', N'FT_IFTSHC_MUTEX', 
        N'HADR_CLUSAPI_CALL', N'HADR_FILESTREAM_IOMGR_IOCOMPLETION', N'HADR_LOGCAPTURE_WAIT', N'HADR_NOTIFICATION_DEQUEUE', N'HADR_TIMER_TASK', 
        N'HADR_WORK_QUEUE', N'KSOURCE_WAKEUP', N'LAZYWRITER_SLEEP', N'LOGMGR_QUEUE', N'MEMORY_ALLOCATION_EXT', N'ONDEMAND_TASK_QUEUE', 
        N'PARALLEL_REDO_DRAIN_WORKER', N'PARALLEL_REDO_LOG_CACHE', N'PARALLEL_REDO_TRAN_LIST', N'PARALLEL_REDO_WORKER_SYNC', N'PARALLEL_REDO_WORKER_WAIT_WORK', 
        N'PREEMPTIVE_OS_FLUSHFILEBUFFERS', N'PREEMPTIVE_XE_GETTARGETSTATE', N'PVS_PREALLOCATE', N'PWAIT_ALL_COMPONENTS_INITIALIZED', 
        N'PWAIT_DIRECTLOGCONSUMER_GETNEXT', N'PWAIT_EXTENSIBILITY_CLEANUP_TASK', N'QDS_PERSIST_TASK_MAIN_LOOP_SLEEP', N'QDS_ASYNC_QUEUE', 
        N'QDS_CLEANUP_STALE_QUERIES_TASK_MAIN_LOOP_SLEEP', N'QDS_SHUTDOWN_QUEUE', N'REDO_THREAD_PENDING_WORK', N'REQUEST_FOR_DEADLOCK_SEARCH', 
        N'RESOURCE_QUEUE', N'SERVER_IDLE_CHECK', N'SLEEP_BPOOL_FLUSH', N'SLEEP_DBSTARTUP', N'SLEEP_DCOMSTARTUP', N'SLEEP_MASTERDBREADY', 
        N'SLEEP_MASTERMDREADY', N'SLEEP_MASTERUPGRADED', N'SLEEP_MSDBSTARTUP', N'SLEEP_SYSTEMTASK', N'SLEEP_TASK', N'SLEEP_TEMPDBSTARTUP', 
        N'SNI_HTTP_ACCEPT', N'SOS_WORK_DISPATCHER', N'SP_SERVER_DIAGNOSTICS_SLEEP', N'SQLTRACE_BUFFER_FLUSH', N'SQLTRACE_INCREMENTAL_FLUSH_SLEEP', 
        N'SQLTRACE_WAIT_ENTRIES', N'VDI_CLIENT_OTHER', N'WAIT_FOR_RESULTS', N'WAITFOR', N'WAITFOR_TASKSHUTDOWN', N'WAIT_XTP_RECOVERY', N'WAIT_XTP_HOST_WAIT', 
        N'WAIT_XTP_OFFLINE_CKPT_NEW_LOG', N'WAIT_XTP_CKPT_CLOSE', N'XE_DISPATCHER_JOIN', N'XE_DISPATCHER_WAIT', N'XE_TIMER_EVENT'
      )
      AND [wait_type] NOT LIKE 'SLEEP_%'
      AND [wait_type] NOT LIKE 'BROKER_%'
        AND [waiting_tasks_count] > 0;

  # - query_name: mssql_diskspace
  #   query: |
  #     select	distinct
  #         --[collection_time_utc] = SYSUTCDATETIME(),
  #         [host_name] = convert(varchar(225),COALESCE(SERVERPROPERTY('ComputerNamePhysicalNetBIOS'),SERVERPROPERTY('ServerName'))),
  #         [disk_volume] = vs.volume_mount_point,
  #         --[label] = null,
  #         [capacity_mb] = vs.total_bytes / 1048576,
  #         [free_mb] = vs.available_bytes / 1048576,
  #         [used_mb] = (vs.total_bytes - vs.available_bytes) / 1048576,
  #         --[block_size] = null,
  #         [filesystem] = file_system_type
  #     from sys.master_files as mf
  #     cross apply sys.dm_os_volume_stats(mf.database_id, mf.file_id) as vs
  #     join sys.databases as db on db.database_id = mf.database_id;

  - query_name: mssql_virtualfilestats
    query: |
      select  --[collection_time_utc] = sysutcdatetime(),
              d.name as [database_name], mf.name as file_logical_name,
              --mf.file_id, d.database_id,
              [disk_volume] = coalesce(vs.volume_mount_point, N''), mf.physical_name as file_location,
              vfs.sample_ms, vfs.num_of_reads, vfs.num_of_bytes_read, vfs.io_stall_read_ms, vfs.io_stall_queued_read_ms,
              vfs.num_of_writes, vfs.num_of_bytes_written, vfs.io_stall_write_ms, vfs.io_stall_queued_write_ms,
              vfs.io_stall, vfs.size_on_disk_bytes,
                  [disk_capacity_mb] = coalesce(vs.total_bytes / 1048576, 0),
                  [disk_free_mb] = coalesce(vs.available_bytes / 1048576, 0),
                  [disk_used_mb] = coalesce((vs.total_bytes - vs.available_bytes) / 1048576, 0),
                  --[block_size] = null,
                  [disk_filesystem] = coalesce(file_system_type, N'')
      from sys.dm_io_virtual_file_stats(null,null) vfs
      join sys.master_files mf on mf.database_id = vfs.database_id and mf.file_id = vfs.file_id
      join sys.databases d on d.database_id = mf.database_id
      outer apply (select * from sys.dm_os_volume_stats(mf.database_id, mf.file_id) as vs) vs;

