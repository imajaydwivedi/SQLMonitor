# A collector defining standard metrics for Microsoft SQL Server.
#
# It is required that the SQL Server user has the following permissions:
#
#   GRANT VIEW ANY DEFINITION TO
#   GRANT VIEW SERVER STATE TO
#
collector_name: mssql_dba_5min

# Similar to global.min_interval, but applies to the queries defined by this collector only.
# min_interval: 0s

metrics:

  #
  # Collected from sys.dm_os_wait_stats
  #
  - metric_name: mssql_waits__wait_time_seconds
    type: counter
    help: 'Total wait time in seconds by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [wait_time_seconds]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__resource_time_seconds
    type: counter
    help: 'Total resource wait time in seconds by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [resource_time_seconds]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__signal_time_seconds
    type: counter
    help: 'Total signal wait time in seconds by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [signal_time_seconds]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__waiting_tasks_count
    type: counter
    help: 'Total waiting tasks by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [waiting_tasks_count]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__wait_percentage
    type: counter
    help: 'Percentage of wait time by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [wait_percentage]
    query_ref: mssql_os_wait_stats

  - metric_name: mssql_waits__wait_rank_no
    type: counter
    help: 'Rank of wait time by wait type since SQL Server startup.'
    key_labels:
      - wait_type
      # - wait_percentage
      # - wait_rank_no
    values: [wait_rank_no]
    query_ref: mssql_os_wait_stats

queries:
  - query_name: mssql_os_wait_stats
    query: |
      SELECT
        [wait_type],
        [wait_time_ms] / 1000.0 AS [wait_time_seconds],
        ([wait_time_ms] - [signal_wait_time_ms]) / 1000.0 AS [resource_time_seconds],
        [signal_wait_time_ms] / 1000.0 AS [signal_time_seconds],
        [waiting_tasks_count],
        100.0 * [wait_time_ms] / SUM([wait_time_ms]) OVER() AS [wait_percentage],
        ROW_NUMBER() OVER (ORDER BY [wait_time_ms] DESC) AS [wait_rank_no]
      FROM sys.dm_os_wait_stats
      WHERE [wait_type] NOT IN (
        N'BROKER_EVENTHANDLER', N'BROKER_RECEIVE_WAITFOR', N'BROKER_TASK_STOP', N'BROKER_TO_FLUSH', N'BROKER_TRANSMITTER', N'CHECKPOINT_QUEUE', N'CHKPT', 
        N'CLR_AUTO_EVENT', N'CLR_MANUAL_EVENT', N'CLR_SEMAPHORE', N'DBMIRROR_DBM_EVENT', N'DBMIRROR_EVENTS_QUEUE', N'DBMIRROR_WORKER_QUEUE', 
        N'DBMIRRORING_CMD', N'DIRTY_PAGE_POLL', N'DISPATCHER_QUEUE_SEMAPHORE', N'EXECSYNC', N'FSAGENT', N'FT_IFTS_SCHEDULER_IDLE_WAIT', N'FT_IFTSHC_MUTEX', 
        N'HADR_CLUSAPI_CALL', N'HADR_FILESTREAM_IOMGR_IOCOMPLETION', N'HADR_LOGCAPTURE_WAIT', N'HADR_NOTIFICATION_DEQUEUE', N'HADR_TIMER_TASK', 
        N'HADR_WORK_QUEUE', N'KSOURCE_WAKEUP', N'LAZYWRITER_SLEEP', N'LOGMGR_QUEUE', N'MEMORY_ALLOCATION_EXT', N'ONDEMAND_TASK_QUEUE', 
        N'PARALLEL_REDO_DRAIN_WORKER', N'PARALLEL_REDO_LOG_CACHE', N'PARALLEL_REDO_TRAN_LIST', N'PARALLEL_REDO_WORKER_SYNC', N'PARALLEL_REDO_WORKER_WAIT_WORK', 
        N'PREEMPTIVE_OS_FLUSHFILEBUFFERS', N'PREEMPTIVE_XE_GETTARGETSTATE', N'PVS_PREALLOCATE', N'PWAIT_ALL_COMPONENTS_INITIALIZED', 
        N'PWAIT_DIRECTLOGCONSUMER_GETNEXT', N'PWAIT_EXTENSIBILITY_CLEANUP_TASK', N'QDS_PERSIST_TASK_MAIN_LOOP_SLEEP', N'QDS_ASYNC_QUEUE', 
        N'QDS_CLEANUP_STALE_QUERIES_TASK_MAIN_LOOP_SLEEP', N'QDS_SHUTDOWN_QUEUE', N'REDO_THREAD_PENDING_WORK', N'REQUEST_FOR_DEADLOCK_SEARCH', 
        N'RESOURCE_QUEUE', N'SERVER_IDLE_CHECK', N'SLEEP_BPOOL_FLUSH', N'SLEEP_DBSTARTUP', N'SLEEP_DCOMSTARTUP', N'SLEEP_MASTERDBREADY', 
        N'SLEEP_MASTERMDREADY', N'SLEEP_MASTERUPGRADED', N'SLEEP_MSDBSTARTUP', N'SLEEP_SYSTEMTASK', N'SLEEP_TASK', N'SLEEP_TEMPDBSTARTUP', 
        N'SNI_HTTP_ACCEPT', N'SOS_WORK_DISPATCHER', N'SP_SERVER_DIAGNOSTICS_SLEEP', N'SQLTRACE_BUFFER_FLUSH', N'SQLTRACE_INCREMENTAL_FLUSH_SLEEP', 
        N'SQLTRACE_WAIT_ENTRIES', N'VDI_CLIENT_OTHER', N'WAIT_FOR_RESULTS', N'WAITFOR', N'WAITFOR_TASKSHUTDOWN', N'WAIT_XTP_RECOVERY', N'WAIT_XTP_HOST_WAIT', 
        N'WAIT_XTP_OFFLINE_CKPT_NEW_LOG', N'WAIT_XTP_CKPT_CLOSE', N'XE_DISPATCHER_JOIN', N'XE_DISPATCHER_WAIT', N'XE_TIMER_EVENT'
      )
        AND [waiting_tasks_count] > 0;

